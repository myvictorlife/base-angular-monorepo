<div class="min-h-screen flex flex-col items-center justify-center bg-gradient-to-br from-blue-50 to-indigo-100">
  <div class="bg-white rounded-xl shadow-lg p-8 max-w-md w-full flex flex-col items-center">
    <button
      class="self-start mb-4 px-4 py-2 bg-gray-100 text-indigo-700 rounded-lg font-medium hover:bg-indigo-50 transition flex items-center gap-2"
      type="button"
      (click)="goHome()"
    >
      <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7"/>
      </svg>
      {{ 'PROFILE.BACK_HOME' | translate }}
    </button>
    <h1 class="text-3xl font-bold text-indigo-700 mb-6">{{ 'PROFILE.TITLE' | translate }}</h1>

    @if (loading()) {
      <p class="text-gray-500 py-6" role="status" aria-live="polite">
        {{ 'PROFILE.LOADING' | translate }}
      </p>
    } @else if (errorMessage(); as message) {
      <div class="w-full flex flex-col items-center gap-3 py-6" role="alert">
        <p class="text-red-600 font-medium">{{ 'PROFILE.ERROR' | translate }}</p>
        <p class="text-gray-500 text-sm">{{ message }}</p>
        <button
          class="px-4 py-2 bg-indigo-600 text-white rounded-lg font-medium hover:bg-indigo-700 transition"
          type="button"
          (click)="loadProfile()"
        >
          {{ 'PROFILE.RETRY' | translate }}
        </button>
      </div>
    } @else if (profile(); as profileData) {
      <lib-user-info [user]="profileData"></lib-user-info>
    }
  </div>
</div>
