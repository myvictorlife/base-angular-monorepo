<main class="update-language">
  <div class="update-language__head">
    <button class="update-language__back" type="button" (click)="goBack()">
      {{ 'BACK' | translate }}
    </button>
    <h1 class="update-language__title">
      {{ 'UPDATE_LANGUAGE.TITLE' | translate }}
    </h1>
  </div>

  <form
    class="update-language__form"
    [formGroup]="languageForm"
    (ngSubmit)="confirmLanguageSelection()"
  >
    <fieldset class="update-language__fieldset">
      <legend class="update-language__legend">
        {{ 'UPDATE_LANGUAGE.TITLE' | translate }}
      </legend>

      @for (lang of languages; track lang.code) {
        <label class="update-language__option" [for]="'lang-' + lang.code">
          <input
            class="update-language__radio"
            type="radio"
            [value]="lang.code"
            formControlName="language"
            [id]="'lang-' + lang.code"
          />
          <span>{{ lang.text }}</span>
        </label>
      }
    </fieldset>

    <button class="update-language__submit" type="submit">
      {{ 'UPDATE_LANGUAGE.UPDATE' | translate }}
    </button>
  </form>
</main>
