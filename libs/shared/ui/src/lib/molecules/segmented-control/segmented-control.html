<div class="segmented" role="radiogroup" [attr.aria-label]="label()">
  @for (option of options(); track option.value) {
  <button
    type="button"
    role="radio"
    class="segmented__segment"
    [class.segmented__segment--active]="value() === option.value"
    [attr.aria-checked]="value() === option.value"
    [attr.lang]="option.lang ?? null"
    (click)="select(option.value)"
  >
    @if (option.label) { {{ option.label }} } @else { {{ option.labelKey ?? '' |
    translate }} }
  </button>
  }
</div>
