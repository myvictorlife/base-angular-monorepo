<button
  type="button"
  class="theme-toggle"
  (click)="toggle()"
  [attr.aria-pressed]="isDark()"
  [attr.aria-label]="labelKey() | translate"
  [attr.title]="labelKey() | translate"
>
  <svg class="theme-toggle__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
    @if (isDark()) {
      <!-- Sun: clicking returns to light -->
      <circle cx="12" cy="12" r="4" />
      <path stroke-linecap="round" d="M12 2v2m0 16v2M2 12h2m16 0h2M4.93 4.93l1.41 1.41m11.32 11.32l1.41 1.41M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41" />
    } @else {
      <!-- Moon: clicking goes to dark -->
      <path stroke-linecap="round" stroke-linejoin="round" d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z" />
    }
  </svg>
</button>
